    <section class="quiz" style="padding: 50px 8%;">
        <h1>🧠 BCA 1st Year Practice Quiz (BBC102 & Core CS)</h1>
        <p>Test your knowledge based on Information Systems and fundamental programming concepts.</p>

        <div class="card" style="max-width: 800px; margin: auto;">
            <h3 id="question">Question Loading...</h3>
            <div id="options" style="margin-top: 20px;"></div>
            <button class="btn-primary" onclick="nextQuestion()" style="margin-top: 20px;">Next Question</button>
            <h3 id="result" style="margin-top:20px;"></h3>
        </div>
    </section>

    <footer>
        <p>© 2026 BrainBuddy AI</p>
    </footer>

    <script src="js/script.js"></script>
    <script>
        const quizData = [
            {
                question: "Which system handles day-to-day routine business transactions and operations?",
                options: ["Management Information System (MIS)", "Transaction Processing System (TPS)", "Decision Support System (DSS)", "Knowledge Work System (KWS)"],
                answer: "Transaction Processing System (TPS)"
            },
            {
                question: "Which information system helps senior managers make semi-structured decisions using 'what-if' analysis?",
                options: ["TPS", "MIS", "DSS", "CRM"],
                answer: "DSS"
            },
            {
                question: "In the information system processing cycle, raw data is organized primarily by which unit?",
                options: ["Input device", "Computer Processor (CPU)", "Storage Drive", "Printer"],
                answer: "Computer Processor (CPU)"
            },
            {
                question: "Salesforce and HubSpot are popular examples of which enterprise platform?",
                options: ["SCM", "CRM", "TPS", "MIS"],
                answer: "CRM"
            },
            {
                question: "What does 'Effectiveness' mean in the context of information systems?",
                options: ["Doing things right with minimal waste", "Doing the right things to achieve strategic goals", "Fast data transfer speed", "Lowering server hardware costs"],
                answer: "Doing the right things to achieve strategic goals"
            },
            {
                question: "C language was developed by whom?",
                options: ["Dennis Ritchie", "James Gosling", "Guido van Rossum", "Bjarne Stroustrup"],
                answer: "Dennis Ritchie"
            },
            {
                question: "Which data structure operates on a First In, First Out (FIFO) basis?",
                options: ["Stack", "Queue", "Tree", "Graph"],
                answer: "Queue"
            },
            {
                question: "What is the full form of RAM in computer architecture?",
                options: ["Read Access Memory", "Random Access Memory", "Run Ample Memory", "Read Alternated Memory"],
                answer: "Random Access Memory"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function loadQuestion(){
            let q = quizData[currentQuestion];
            document.getElementById("question").innerHTML = `Q${currentQuestion + 1}: ${q.question}`;
            let optionBox = document.getElementById("options");
            optionBox.innerHTML="";

            q.options.forEach(option=>{
                optionBox.innerHTML += `
                    <button class="btn-secondary" style="margin-bottom: 12px; width:100%; text-align:left; display:block;" onclick="checkAnswer('${option}', this)">
                        ${option}
                    </button>
                `;
            });
        }

        function checkAnswer(selected, button){
            if(answered) return;
            answered = true;
            
            let correct = quizData[currentQuestion].answer;
            if(selected === correct){
                score++;
                button.style.border = "2px solid #22c55e";
                button.style.background = "rgba(34, 197, 94, 0.2)";
            } else {
                button.style.border = "2px solid #ef4444";
                button.style.background = "rgba(239, 68, 68, 0.2)";
            }
        }

        function nextQuestion(){
            answered = false;
            currentQuestion++;

            if(currentQuestion < quizData.length){
                loadQuestion();
            } else {
                document.getElementById("question").innerHTML = "Quiz Completed 🎉";
                document.getElementById("options").innerHTML="";
                document.getElementById("result").innerHTML = `Your Score: ${score} / ${quizData.length}`;
                saveQuizScore(score);
            }
        }

        loadQuestion();
    </script>
</body>
