<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBuddy AI Resume Builder</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-J5CV0GQFNV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-J5CV0GQFNV');
</script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">BrainBuddy AI</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="career.html">Career</a></li>
            </ul>
        </nav>
    </header>

    <section class="resume" style="padding: 50px 8%;">
        <h1>📄 Resume Builder</h1>
        <p>Create your professional student resume for internships.</p>

        <div class="card" style="max-width: 600px; margin: 30px auto; display: grid; gap: 15px;">
            <input type="text" id="name" placeholder="Your Name" style="padding: 12px; border-radius: 10px; background:#0f172a; color:white; border:1px solid #60a5fa;">
            <input type="text" id="education" placeholder="Education (Example: BCA 1st Year)" style="padding: 12px; border-radius: 10px; background:#0f172a; color:white; border:1px solid #60a5fa;">
            <input type="text" id="skills" placeholder="Skills (HTML, CSS, Information Systems)" style="padding: 12px; border-radius: 10px; background:#0f172a; color:white; border:1px solid #60a5fa;">
            <input type="text" id="projects" placeholder="Projects" style="padding: 12px; border-radius: 10px; background:#0f172a; color:white; border:1px solid #60a5fa;">
            <input type="text" id="experience" placeholder="Internship / Experience" style="padding: 12px; border-radius: 10px; background:#0f172a; color:white; border:1px solid #60a5fa;">
            <button class="btn-primary" onclick="generateResume()">Generate Resume</button>
        </div>

        <div class="card" id="resumeOutput" style="max-width: 600px; margin: auto;">
            <h2>Your Resume Preview</h2>
            <p>Fill details above to generate preview.</p>
        </div>
    </section>

    <footer>
        <p>© 2026 BrainBuddy AI</p>
    </footer>

    <script>
        function generateResume(){
            let name = document.getElementById("name").value;
            let education = document.getElementById("education").value;
            let skills = document.getElementById("skills").value;
            let projects = document.getElementById("projects").value;
            let experience = document.getElementById("experience").value;

            let resume = `
                <h2>${name}</h2>
                <h3 style="color:#60a5fa; margin-top:15px;">Education</h3>
                <p>${education}</p>
                <h3 style="color:#60a5fa; margin-top:15px;">Skills</h3>
                <p>${skills}</p>
                <h3 style="color:#60a5fa; margin-top:15px;">Projects</h3>
                <p>${projects}</p>
                <h3 style="color:#60a5fa; margin-top:15px;">Experience</h3>
                <p>${experience}</p>
            `;
            document.getElementById("resumeOutput").innerHTML = resume;
            localStorage.setItem("resume", resume);
        }

        window.onload = function(){
            let savedResume = localStorage.getItem("resume");
            if(savedResume){
                document.getElementById("resumeOutput").innerHTML = savedResume;
            }
        }
    </script>
</body>
</html>
