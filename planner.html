<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBuddy AI Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">BrainBuddy AI</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="planner.html" style="color:#60a5fa;">Planner</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li><a href="career.html">Career</a></li>
            </ul>
        </nav>
    </header>

    <section class="planner" style="padding: 50px 8%;">
        <h1>📅 Study Planner</h1>
        <p>Create your daily study tasks and track your learning progress.</p>

        <div class="planner-box" style="margin-top: 30px;">
            <input type="text" id="taskInput" placeholder="Enter your study task (e.g., Read BBC102 Unit 1)..." style="padding: 12px; width: 60%; border-radius: 10px; border: 1px solid #60a5fa; background: #1e293b; color: white; margin-right: 10px;">
            <button class="btn-primary" onclick="addPlannerTask()" style="margin-top:0 !important;">Add Task</button>
        </div>

        <div id="taskList" style="margin-top: 30px; display: grid; gap: 15px;"></div>
    </section>

    <footer>
        <p>© 2026 BrainBuddy AI</p>
    </footer>

    <script src="js/script.js"></script>
    <script>
        function addPlannerTask(){
            let task = document.getElementById("taskInput").value;
            if(task==""){
                alert("Please enter a task");
                return;
            }
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.push(task);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            document.getElementById("taskInput").value="";
            displayTasks();
        }

        function displayTasks(){
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            let box = document.getElementById("taskList");
            box.innerHTML="";
            tasks.forEach((task,index)=>{
                box.innerHTML += `
                    <div class="card" style="flex-direction: row; justify-content: space-between; align-items: center; padding: 20px;">
                        <h3 style="margin:0;">${task}</h3>
                        <button class="btn-primary" style="margin:0 !important; background:#ef4444;" onclick="deleteTask(${index})">Complete</button>
                    </div>
                `;
            });
        }

        function deleteTask(index){
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.splice(index,1);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            displayTasks();
        }
        displayTasks();
    </script>
</body>
</html>
